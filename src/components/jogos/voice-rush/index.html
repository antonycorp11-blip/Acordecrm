<!DOCTYPE html>
<html lang="pt-BR" class="h-full overflow-hidden">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VoiceRush - Treino Auditivo Pro</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VoiceRush">
  <link rel="apple-touch-icon" href="/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --app-height: 100%;
      --orange-brand: #FF6B00;
      --brown-brand: #3D2B1F;
      --black-brand: #121212;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--black-brand);
      color: white;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #root {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .bg-brand-brown {
      background-color: var(--brown-brand);
    }

    .text-brand-orange {
      color: var(--orange-brand);
    }

    .bg-brand-orange {
      background-color: var(--orange-brand);
    }

    .border-brand-orange {
      border-color: var(--orange-brand);
    }

    @keyframes pulse-orange {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 107, 0, 0.4);
      }

      70% {
        box-shadow: 0 0 0 20px rgba(255, 107, 0, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(255, 107, 0, 0);
      }
    }

    .animate-pulse-orange {
      animation: pulse-orange 2s infinite;
    }

    @keyframes scale-up-center {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .scale-up-center {
      animation: scale-up-center 0.4s cubic-bezier(0.390, 0.575, 0.565, 1.000) both;
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    .animate-shimmer {
      position: relative;
      overflow: hidden;
    }

    .animate-shimmer::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes score-up {
      0% {
        transform: scale(1);
        color: #FF6B00;
      }

      50% {
        transform: scale(1.3);
        color: #39FF14;
      }

      100% {
        transform: scale(1);
        color: #FF6B00;
      }
    }

    .animate-score-up {
      animation: score-up 0.6s ease-out;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script>
    const setVH = () => {
      let vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
      document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
    };
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', setVH);
    setVH();
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
